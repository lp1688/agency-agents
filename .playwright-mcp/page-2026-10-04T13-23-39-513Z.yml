    - link "Kimi Code — Agents and Sub-Agents" [ref=e212] [cursor=pointer]:
      - /url: https://www.kimi.com/code/docs/en/kimi-code-cli/customization/agents.html
    - text: 、
    - link "kimi 命令列參數" [ref=e213] [cursor=pointer]:
      - /url: https://www.kimi.com/code/docs/en/kimi-code-cli/reference/kimi-command.html